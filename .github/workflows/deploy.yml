name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Maximum allowed (6 hours)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Test variant matrix
        run: |
          chmod +x scripts/test-variant-matrix.sh
          ./scripts/test-variant-matrix.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install OpenSCAD Nightly
        run: |
          # jq assembles public/manifest.json; the build aborts without it.
          sudo apt-get install -y --no-install-recommends jq
          sudo snap install openscad-nightly
          echo "OpenSCAD version:"
          openscad-nightly --version
          echo "Available backends:"
          openscad-nightly --help 2>&1 | grep -A2 'backend' || true

      - name: Show system resources
        run: |
          echo "=== System Info ==="
          echo "CPU: $(nproc) cores"
          free -h
          df -h .
          echo "==================="

      - name: Test front circle geometry
        run: |
          chmod +x scripts/test-front-circle.sh
          OPENSCAD=openscad-nightly ./scripts/test-front-circle.sh

      - name: Test fan cable notch geometry
        run: |
          chmod +x scripts/test-fan-wire-slots.sh
          OPENSCAD=openscad-nightly ./scripts/test-fan-wire-slots.sh

      # These were written but never wired up, so six of the nine suites only ever ran on
      # someone's laptop -- including the two that guard the dust filter's fit and label.
      # They cost ~31s between them against a 6-hour budget; there was no trade-off here,
      # just an omission. Kept as one step so adding a suite is a one-line change.
      - name: Test CAD geometry
        run: |
          for suite in dust-label dust-clip-fit lip-fit canoe-axis vent-patterns; do
            echo "::group::test-$suite"
            chmod +x "scripts/test-$suite.sh"
            OPENSCAD=openscad-nightly "./scripts/test-$suite.sh"
            echo "::endgroup::"
          done

      - name: Generate STL files
        timeout-minutes: 360  # Maximum allowed for step (6 hours)
        run: |
          chmod +x scripts/generate-stl.sh
          ./scripts/generate-stl.sh --ci

      # Against the manifest the build just produced, not the committed dev fixture: the
      # contract that matters is the one being deployed.
      - name: Test manifest contract
        run: |
          chmod +x scripts/test-manifest.sh
          ./scripts/test-manifest.sh public/manifest.json

      - name: Install dependencies
        run: npm ci

      - name: Test website
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
